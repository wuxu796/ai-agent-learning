<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>食鉴</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, "Microsoft YaHei", sans-serif;
    background: #f5f5f5;
    height: 100vh;
    display: flex;
    justify-content: center;
  }
  .app {
    width: 100%;
    max-width: 900px;
    height: 100vh;
    display: flex;
    background: #fff;
  }

  /* 侧边栏 */
  .sidebar {
    width: 260px;
    min-width: 260px;
    border-right: 1px solid #eee;
    display: flex;
    flex-direction: column;
    background: #fafafa;
    transition: width 0.2s, min-width 0.2s;
    overflow: hidden;
  }
  .sidebar.collapsed { width: 0; min-width: 0; border: none; }
  .toggle-sidebar {
    background: none; border: none; font-size: 18px;
    cursor: pointer; padding: 2px 8px; color: #999;
  }
  .toggle-sidebar:hover { color: #333; }
  .sidebar-header {
    padding: 16px;
    border-bottom: 1px solid #eee;
  }
  .sidebar-header h2 { font-size: 18px; margin-bottom: 10px; }
  .sidebar-header button {
    width: 100%;
    padding: 8px;
    background: #1677ff;
    color: #fff;
    border: none;
    border-radius: 6px;
    font-size: 14px;
    cursor: pointer;
  }
  .sidebar-header button:hover { background: #4096ff; }
  .session-list {
    flex: 1;
    overflow-y: auto;
    padding: 8px;
  }
  .session-item {
    padding: 10px 12px;
    border-radius: 8px;
    cursor: pointer;
    margin-bottom: 4px;
    transition: background 0.15s;
  }
  .session-item:hover { background: #eee; }
  .session-item.active { background: #e6f0ff; }
  .session-item .preview {
    font-size: 13px;
    color: #333;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .session-item .meta {
    font-size: 11px;
    color: #999;
    margin-top: 3px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .session-item .delete-btn {
    opacity: 0;
    color: #d44;
    background: none;
    border: none;
    cursor: pointer;
    font-size: 14px;
    padding: 0 4px;
  }
  .session-item:hover .delete-btn { opacity: 1; }

  /* 主聊天区 */
  .main {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
  }
  .main-header {
    padding: 14px 20px;
    border-bottom: 1px solid #eee;
    font-size: 17px;
    font-weight: 600;
  }
  .chat {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
  }
  .msg { margin-bottom: 18px; position: relative; }
  .msg.user { text-align: right; }
  .msg .bubble {
    display: inline-block;
    max-width: 85%;
    padding: 10px 16px;
    border-radius: 12px;
    font-size: 15px;
    line-height: 1.55;
    word-break: break-word;
    text-align: left;
    position: relative;
  }
  .msg.user .bubble {
    background: #1677ff;
    color: #fff;
    border-bottom-right-radius: 4px;
  }
  .msg.assistant .bubble {
    background: #f0f0f0;
    color: #333;
    border-bottom-left-radius: 4px;
  }
  /* Markdown 内容样式 */
  .bubble h1, .bubble h2, .bubble h3 { margin: 8px 0 4px; font-size: 1.05em; }
  .bubble p { margin: 2px 0; }
  .bubble ul, .bubble ol { padding-left: 20px; margin: 2px 0; }
  .bubble li { margin: 2px 0; }
  .bubble strong { font-weight: 600; }
  .bubble code {
    background: rgba(0,0,0,0.08); padding: 1px 5px;
    border-radius: 3px; font-size: 0.9em;
  }
  .bubble pre {
    background: #282c34; color: #abb2bf;
    padding: 12px 16px; border-radius: 8px;
    overflow-x: auto; margin: 8px 0; font-size: 13px;
  }
  .bubble pre code { background: none; padding: 0; }
  .msg.user .bubble code, .msg.user .bubble pre { background: rgba(255,255,255,0.15); color: #fff; }

  /* 复制按钮 */
  .copy-btn {
    position: absolute;
    top: 4px; right: 4px;
    background: rgba(0,0,0,0.06);
    border: none; border-radius: 4px;
    cursor: pointer; font-size: 13px;
    padding: 2px 6px; color: #999;
    opacity: 0; transition: opacity 0.15s;
  }
  .msg.assistant .bubble:hover .copy-btn { opacity: 1; }
  .copy-btn.copied { color: #52c41a; }

  /* 输入区 */
  .input-area {
    padding: 12px 20px;
    border-top: 1px solid #eee;
    display: flex;
    gap: 10px;
    align-items: flex-end;
  }
  .input-area textarea {
    flex: 1;
    padding: 10px 14px;
    border: 1px solid #ddd;
    border-radius: 8px;
    font-size: 15px;
    outline: none;
    font-family: inherit;
    resize: none;
    min-height: 42px;
    max-height: 150px;
    line-height: 1.4;
  }
  .input-area textarea:focus { border-color: #1677ff; }
  .input-area button {
    padding: 10px 20px;
    background: #1677ff;
    color: #fff;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-size: 15px;
    white-space: nowrap;
    height: 42px;
  }
  .input-area button:hover { background: #4096ff; }
  .input-area button:disabled { background: #bbb; cursor: not-allowed; }
  .thinking { color: #999; font-style: italic; padding: 8px 0; font-size: 14px; }
  .empty { text-align: center; color: #bbb; margin-top: 100px; }
  .empty p { margin: 8px 0; font-size: 14px; }

  @media (max-width: 640px) {
    .sidebar { display: none; }
    .input-area { padding: 8px 12px; }
  }
</style>
</head>
<body>
<div class="app">
  <!-- 侧边栏 -->
  <div class="sidebar">
    <div class="sidebar-header">
      <h2>食鉴</h2>
      <button onclick="newSession()">+ 新对话</button>
    </div>
    <div class="session-list" id="sessionList"></div>
  </div>

  <!-- 主聊天区 -->
  <div class="main">
    <div class="main-header">
      <button class="toggle-sidebar" onclick="toggleSidebar()" title="收起/展开侧边栏">☰</button>
      <span>营养健康助手</span>
    </div>
    <div class="chat" id="chat">
      <div class="empty" id="emptyState">
        <p>👋 你好，我是食鉴</p>
        <p>算 BMI · 算每日消耗 · 搜全书知识</p>
      </div>
    </div>
    <div class="input-area">
      <textarea id="input" placeholder="问点什么…  Enter 发送，Shift+Enter 换行" rows="1"></textarea>
      <button id="sendBtn" onclick="send()">发送</button>
    </div>
  </div>
</div>

<script>
let sessionId = null;

function toggleSidebar() {
  document.querySelector('.sidebar').classList.toggle('collapsed');
}

// ==================== 初始化 ====================

async function init() {
  await refreshSessionList();
  const lastId = localStorage.getItem('sessionId');
  const items = document.querySelectorAll('.session-item');
  let target = null;
  if (lastId) target = document.querySelector(`[data-sid="${lastId}"]`);
  if (!target) target = items[0];
  if (target) {
    target.click();
  } else {
    await newSession();
  }
}

// ==================== 会话列表 ====================

function formatDate(isoStr) {
  const d = new Date(isoStr);
  const now = new Date();
  const pad = n => String(n).padStart(2, '0');
  const time = `${pad(d.getHours())}:${pad(d.getMinutes())}`;
  // 今天的只显示时间，更早的显示月-日
  if (d.toDateString() === now.toDateString()) return time;
  return `${d.getMonth() + 1}-${pad(d.getDate())} ${time}`;
}

async function refreshSessionList() {
  const res = await fetch('/api/sessions');
  const sessions = await res.json();
  const list = document.getElementById('sessionList');
  list.innerHTML = sessions.map(s => `
    <div class="session-item${s.session_id === sessionId ? ' active' : ''}"
         data-sid="${s.session_id}" onclick="loadSession('${s.session_id}')">
      <div class="preview">${escapeHtml(s.preview)}</div>
      <div class="meta">
        <span>${s.message_count} 条 · ${formatDate(s.created_at)}</span>
        <button class="delete-btn" onclick="deleteSession(event, '${s.session_id}')">✕</button>
      </div>
    </div>
  `).join('');
}

function highlightActive() {
  document.querySelectorAll('.session-item').forEach(el => {
    el.classList.toggle('active', el.dataset.sid === sessionId);
  });
}

// ==================== 加载/创建会话 ====================

async function loadSession(sid) {
  sessionId = sid;
  localStorage.setItem('sessionId', sid);
  highlightActive();

  const res = await fetch(`/api/sessions/${sid}`);
  const data = await res.json();
  const chat = document.getElementById('chat');
  chat.innerHTML = '';

  if (data.messages.length === 0) {
    chat.innerHTML = `<div class="empty"><p>👋 开始新对话</p></div>`;
  } else {
    data.messages.forEach(m => appendMsg(m.role, m.content));
  }
  scrollBottom();
}

async function newSession() {
  const res = await fetch('/api/sessions', { method: 'POST' });
  const data = await res.json();
  await refreshSessionList();
  await loadSession(data.session_id);
}

// ==================== 发送消息 ====================

async function send() {
  const input = document.getElementById('input');
  const btn = document.getElementById('sendBtn');
  const message = input.value.trim();
  if (!message) return;

  input.value = '';
  input.style.height = 'auto';  // 重置高度
  input.disabled = true;
  btn.disabled = true;

  appendMsg('user', message);

  const chat = document.getElementById('chat');
  const think = document.createElement('div');
  think.className = 'thinking';
  think.id = 'thinking';
  think.textContent = '思考中...';
  chat.appendChild(think);
  scrollBottom();

  try {
    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ session_id: sessionId, message }),
    });
    const data = await res.json();
    document.getElementById('thinking')?.remove();
    appendMsg('assistant', data.reply);
    scrollBottom();
    refreshSessionList();
  } catch (e) {
    document.getElementById('thinking')?.remove();
    appendMsg('assistant', '出错了，请稍后重试。');
  }

  input.disabled = false;
  btn.disabled = false;
  input.focus();
}

// ==================== 删除会话 ====================

async function deleteSession(e, sid) {
  e.stopPropagation();
  await fetch(`/api/sessions/${sid}`, { method: 'DELETE' });
  if (sid === sessionId) {
    sessionId = null;
    localStorage.removeItem('sessionId');
  }
  await refreshSessionList();
  if (!sessionId) {
    const first = document.querySelector('.session-item');
    if (first) first.click();
    else await newSession();
  }
}

// ==================== 复制消息 ====================

function copyMsg(btn) {
  const bubble = btn.closest('.bubble');
  // 获取纯文本内容
  const text = bubble.textContent || '';
  navigator.clipboard.writeText(text).then(() => {
    btn.textContent = '已复制';
    btn.classList.add('copied');
    setTimeout(() => { btn.textContent = '📋'; btn.classList.remove('copied'); }, 1500);
  });
}

// ==================== Markdown 渲染 ====================

function renderMd(text) {
  // 代码块先保护起来，避免被后续规则干扰
  const codeBlocks = [];
  let html = text.replace(/```(\w*)\n([\s\S]*?)```/g, (_, lang, code) => {
    const id = codeBlocks.length;
    codeBlocks.push(`<pre><code>${escapeHtml(code.trim())}</code></pre>`);
    return `%%CODEBLOCK_${id}%%`;
  });

  // 转义 HTML 防 XSS
  html = escapeHtml(html);

  // 逐行处理
  const lines = html.split('\n');
  const result = [];
  let inList = null;  // 'ul' | 'ol' | null

  function closeList() {
    if (inList) {
      result.push(`</${inList}>`);
      inList = null;
    }
  }

  for (let i = 0; i < lines.length; i++) {
    let line = lines[i];

    // 空行不打断列表
    if (line.trim() === '') {
      continue;
    }

    // 行内代码 `...`
    line = line.replace(/`([^`]+)`/g, '<code>$1</code>');
    // 粗体 **...**
    line = line.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');

    // 标题
    let hMatch = line.match(/^### (.+)/);
    if (hMatch) { closeList(); result.push(`<h3>${hMatch[1]}</h3>`); continue; }
    hMatch = line.match(/^## (.+)/);
    if (hMatch) { closeList(); result.push(`<h2>${hMatch[1]}</h2>`); continue; }
    hMatch = line.match(/^# (.+)/);
    if (hMatch) { closeList(); result.push(`<h1>${hMatch[1]}</h1>`); continue; }

    // 无序列表
    let liMatch = line.match(/^[\-\*] (.+)/);
    if (liMatch) {
      if (inList !== 'ul') { closeList(); result.push('<ul>'); inList = 'ul'; }
      result.push(`<li>${liMatch[1]}</li>`);
      continue;
    }

    // 有序列表
    liMatch = line.match(/^\d+\. (.+)/);
    if (liMatch) {
      if (inList !== 'ol') { closeList(); result.push('<ol>'); inList = 'ol'; }
      result.push(`<li>${liMatch[1]}</li>`);
      continue;
    }

    // 普通段落 → 结束列表
    closeList();
    result.push(line);
  }
  closeList();

  html = result.join('\n');

  // 还原代码块
  html = html.replace(/%%CODEBLOCK_(\d+)%%/g, (_, id) => codeBlocks[parseInt(id)]);

  return html;
}

// ==================== 工具函数 ====================

function appendMsg(role, content) {
  const chat = document.getElementById('chat');
  const empty = chat.querySelector('.empty');
  if (empty) empty.remove();

  const div = document.createElement('div');
  div.className = `msg ${role}`;
  const bubbleHtml = role === 'assistant' ? renderMd(content) : escapeHtml(content);
  const copyBtn = role === 'assistant'
    ? '<button class="copy-btn" onclick="copyMsg(this)">📋</button>' : '';
  div.innerHTML = `<div class="bubble">${copyBtn}${bubbleHtml}</div>`;
  chat.appendChild(div);
}

function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

function scrollBottom() {
  const chat = document.getElementById('chat');
  chat.scrollTop = chat.scrollHeight;
}

// ==================== 输入框：Enter 发送，Shift+Enter 换行 ====================

document.getElementById('input').addEventListener('keydown', function(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    send();
  }
});

// 自动调整输入框高度
document.getElementById('input').addEventListener('input', function() {
  this.style.height = 'auto';
  this.style.height = Math.min(this.scrollHeight, 150) + 'px';
});

init();
</script>
</body>
</html>
